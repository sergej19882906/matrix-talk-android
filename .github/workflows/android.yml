name: Android Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Позволяет запустить сборку вручную кнопкой в интерфейсе GitHub

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout кода
        uses: actions/checkout@v4

      - name: ☕ Установка JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Кэширование зависимостей Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔧 Предоставление прав на выполнение gradlew
        run: chmod +x ./gradlew

      - name: 🛠️ Сборка Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 📤 Загрузка APK как артефакта
        uses: actions/upload-artifact@v4
        with:
          name: matrix-talk-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7 # Артефакт будет храниться 7 дней